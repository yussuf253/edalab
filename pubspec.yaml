name: edalab
description: "EdaLab - Your All-in-One Super App"
publish_to: 'none'
version: 1.7.0+7

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.20.2
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  animate_do: ^3.3.4
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  lottie: ^3.3.1
  iconsax: ^0.0.8
  flutter_staggered_animations: ^1.1.1
  readmore: ^3.0.0
  dotted_border: ^2.1.0
  timeline_tile: ^2.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.6.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  google_maps_flutter: ^2.17.0
  app_links: ^3.2.0
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  amplitude_flutter: ^4.0.0
  webview_flutter: ^4.4.2
  webview_flutter_wkwebview: ^3.0.6
  web_socket_channel: ^2.4.0
  flutter_gen: ^5.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/categories/
    - assets/images/banners/
    - assets/images/services/
    - assets/icons/
    - assets/lottie/

