<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Edalab</title>
    <link rel="stylesheet" href="css/main-styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules.css">
    <style>
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        .checkout-form {
            background: white;
            border-radius: 12px;
            padding: 24px;
        }

        .section-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #667eea;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .address-list {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .address-option {
            padding: 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .address-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .address-option.selected {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .address-option input[type="radio"] {
            margin-right: 12px;
        }

        .address-title {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .address-text {
            font-size: 13px;
            color: #666;
        }

        .add-new-address-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 2px dashed #667eea;
            border-radius: 8px;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-new-address-btn:hover {
            background: #f8f9ff;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .payment-option {
            padding: 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }

        .payment-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .payment-option.selected {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .payment-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .payment-details {
            flex: 1;
        }

        .payment-name {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .payment-info {
            font-size: 13px;
            color: #666;
        }

        .delivery-options {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .delivery-option {
            padding: 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delivery-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .delivery-option.selected {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .delivery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .delivery-name {
            font-weight: 600;
            color: #1a1a1a;
        }

        .delivery-price {
            font-weight: 700;
            color: #667eea;
        }

        .delivery-time {
            font-size: 13px;
            color: #666;
        }

        .promo-code-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .promo-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .promo-input {
            flex: 1;
        }

        .promo-btn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .promo-btn:hover {
            background: #764ba2;
        }

        .order-summary {
            background: white;
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .summary-section:last-child {
            border-bottom: none;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #666;
        }

        .order-item.total {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
            border-top: 2px solid #eee;
            padding-top: 12px;
            margin-top: 12px;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .cost-label {
            color: #666;
        }

        .cost-value {
            color: #1a1a1a;
            font-weight: 600;
        }

        .cost-value.discount {
            color: #27ae60;
        }

        .place-order-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        .place-order-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart-message {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }

        .empty-cart-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .continue-shopping-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .notes-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>

    <!-- Page Title -->
    <div style="background: #f8f9fa; padding: 20px; text-align: center; border-bottom: 1px solid #eee;">
        <h1 style="margin: 0; font-size: 28px; color: #1a1a1a;">Checkout</h1>
    </div>

    <div class="checkout-container" id="checkoutContainer">
        <!-- Checkout Form -->
        <div>
            <!-- Delivery Address Section -->
            <div class="checkout-form">
                <div class="section-header">Delivery Address</div>
                <div class="address-list" id="addressList"></div>
                <button class="add-new-address-btn" onclick="checkout.showAddressForm()">+ Add New Address</button>

                <!-- Address Form (Hidden by default) -->
                <div id="addressForm" style="display: none; margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
                    <h4 style="margin-top: 0;">Add New Address</h4>
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="addressType">
                            <option value="home">Home</option>
                            <option value="work">Work</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Street Address</label>
                        <input type="text" class="form-input" id="addressStreet" placeholder="123 Main Street">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <input type="text" class="form-input" id="addressCity" placeholder="City">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-input" id="addressZip" placeholder="Postal Code">
                        </div>
                    </div>
                    <button onclick="checkout.saveAddress()" style="width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 12px;">Save Address</button>
                    <button onclick="checkout.hideAddressForm()" style="width: 100%; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
                </div>
            </div>

            <!-- Delivery Options Section -->
            <div class="checkout-form" style="margin-top: 20px;">
                <div class="section-header">Delivery Speed</div>
                <div class="delivery-options" id="deliveryOptions"></div>
            </div>

            <!-- Payment Method Section -->
            <div class="checkout-form" style="margin-top: 20px;">
                <div class="section-header">Payment Method</div>
                <div class="payment-methods" id="paymentMethods"></div>
            </div>

            <!-- Special Instructions -->
            <div class="checkout-form" style="margin-top: 20px;">
                <div class="section-header">Special Instructions</div>
                <div class="form-group">
                    <label class="form-label">Leave a note for the delivery person</label>
                    <textarea class="notes-textarea" id="deliveryNotes" placeholder="e.g., Please ring the doorbell twice..."></textarea>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div>
            <div class="order-summary" id="orderSummary"></div>
        </div>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/ui-components.js"></script>
    <script>
        class CheckoutManager {
            constructor() {
                this.cartItems = [];
                this.module = new URLSearchParams(window.location.search).get('module') || 'shopping';
                this.selectedAddress = null;
                this.selectedPayment = 0;
                this.selectedDelivery = 0;
                this.deliveryOptions = [
                    { name: 'Standard Delivery', time: '30-40 min', price: 0 },
                    { name: 'Express Delivery', time: '15-20 min', price: 9.99 },
                    { name: 'Same Day Delivery', time: 'By Evening', price: 14.99 }
                ];
                this.paymentMethods = [
                    { id: 0, name: 'Credit Card', info: '**** **** **** 4242', icon: '💳' },
                    { id: 1, name: 'Apple Pay', info: 'Apple Pay', icon: '🍎' },
                    { id: 2, name: 'PayPal', info: 'PayPal Account', icon: '🅿️' },
                    { id: 3, name: 'Cash on Delivery', info: 'Pay when order arrives', icon: '💵' }
                ];
                this.init();
            }

            init() {
                this.cartItems = StateManager.getCart(this.module);
                
                if (this.cartItems.length === 0) {
                    this.showEmptyCart();
                    return;
                }

                this.loadUserData();
                this.renderAddresses();
                this.renderDeliveryOptions();
                this.renderPaymentMethods();
                this.renderOrderSummary();
            }

            loadUserData() {
                const user = StateManager.getUser();
                if (user && user.addresses && user.addresses.length > 0) {
                    this.selectedAddress = 0;
                }
            }

            renderAddresses() {
                const user = StateManager.getUser();
                const addressList = document.getElementById('addressList');
                
                if (!user || !user.addresses || user.addresses.length === 0) {
                    addressList.innerHTML = '<p style="text-align: center; color: #999;">No saved addresses</p>';
                    return;
                }

                addressList.innerHTML = user.addresses.map((addr, idx) => `
                    <label class="address-option ${idx === this.selectedAddress ? 'selected' : ''}">
                        <input type="radio" name="address" value="${idx}" 
                            ${idx === this.selectedAddress ? 'checked' : ''}
                            onchange="checkout.selectAddress(${idx})">
                        <div style="flex: 1;">
                            <div class="address-title">${addr.type.charAt(0).toUpperCase() + addr.type.slice(1)}</div>
                            <div class="address-text">${addr.street}, ${addr.city} ${addr.zip}</div>
                        </div>
                    </label>
                `).join('');
            }

            selectAddress(idx) {
                this.selectedAddress = idx;
                this.renderOrderSummary();
            }

            showAddressForm() {
                document.getElementById('addressForm').style.display = 'block';
            }

            hideAddressForm() {
                document.getElementById('addressForm').style.display = 'none';
            }

            saveAddress() {
                const type = document.getElementById('addressType').value;
                const street = document.getElementById('addressStreet').value;
                const city = document.getElementById('addressCity').value;
                const zip = document.getElementById('addressZip').value;

                if (!street || !city || !zip) {
                    UIComponents.showToast('Please fill in all address fields');
                    return;
                }

                const newAddress = { type, street, city, zip };
                const user = StateManager.getUser() || {
                    id: 'guest-user',
                    firstName: 'Guest',
                    lastName: 'User',
                    email: 'guest@local.edalab',
                    addresses: [],
                    payments: [],
                };
                if (!user.addresses) user.addresses = [];
                user.addresses.push(newAddress);
                StateManager.setUser(user);

                this.selectedAddress = user.addresses.length - 1;
                this.hideAddressForm();
                this.renderAddresses();
                UIComponents.showToast('Address saved!');
            }

            renderDeliveryOptions() {
                const container = document.getElementById('deliveryOptions');
                container.innerHTML = this.deliveryOptions.map((opt, idx) => `
                    <label class="delivery-option ${idx === this.selectedDelivery ? 'selected' : ''}">
                        <input type="radio" name="delivery" value="${idx}" 
                            ${idx === this.selectedDelivery ? 'checked' : ''}
                            onchange="checkout.selectDelivery(${idx})">
                        <div style="flex: 1;">
                            <div class="delivery-header">
                                <span class="delivery-name">${opt.name}</span>
                                <span class="delivery-price">${opt.price === 0 ? 'FREE' : '$' + opt.price.toFixed(2)}</span>
                            </div>
                            <div class="delivery-time">${opt.time}</div>
                        </div>
                    </label>
                `).join('');
            }

            selectDelivery(idx) {
                this.selectedDelivery = idx;
                this.renderOrderSummary();
            }

            renderPaymentMethods() {
                const container = document.getElementById('paymentMethods');
                container.innerHTML = this.paymentMethods.map((method, idx) => `
                    <label class="payment-option ${idx === this.selectedPayment ? 'selected' : ''}">
                        <input type="radio" name="payment" value="${idx}" 
                            ${idx === this.selectedPayment ? 'checked' : ''}
                            onchange="checkout.selectPayment(${idx})">
                        <span class="payment-icon">${method.icon}</span>
                        <div class="payment-details">
                            <div class="payment-name">${method.name}</div>
                            <div class="payment-info">${method.info}</div>
                        </div>
                    </label>
                `).join('');
            }

            selectPayment(idx) {
                this.selectedPayment = idx;
            }

            renderOrderSummary() {
                const container = document.getElementById('orderSummary');
                
                const subtotal = this.cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const delivery = this.deliveryOptions[this.selectedDelivery].price;
                const tax = subtotal * 0.08;
                const discount = StateManager.getDiscount();
                const total = subtotal + delivery + tax - discount;

                container.innerHTML = `
                    <div class="summary-section">
                        <div class="summary-title">Order Items</div>
                        ${this.cartItems.map(item => `
                            <div class="order-item">
                                <span>${item.name} × ${item.quantity}</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="summary-section">
                        <div class="summary-title">Pricing</div>
                        <div class="cost-row">
                            <span class="cost-label">Subtotal</span>
                            <span class="cost-value">$${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="cost-row">
                            <span class="cost-label">Delivery</span>
                            <span class="cost-value">${delivery === 0 ? 'FREE' : '$' + delivery.toFixed(2)}</span>
                        </div>
                        <div class="cost-row">
                            <span class="cost-label">Tax (8%)</span>
                            <span class="cost-value">$${tax.toFixed(2)}</span>
                        </div>
                        ${discount > 0 ? `
                            <div class="cost-row">
                                <span class="cost-label">Discount</span>
                                <span class="cost-value discount">-$${discount.toFixed(2)}</span>
                            </div>
                        ` : ''}
                    </div>

                    <div class="summary-section">
                        <div class="cost-row">
                            <span style="font-size: 16px; font-weight: 700;">Total Amount</span>
                            <span style="font-size: 20px; font-weight: 700; color: #667eea;">$${total.toFixed(2)}</span>
                        </div>
                    </div>

                    <button class="place-order-btn" onclick="checkout.placeOrder()">
                        Place Order
                    </button>
                `;
            }

            async placeOrder() {
                const address = this.getSelectedAddress();
                if (!address) {
                    UIComponents.showToast('Please select or add a delivery address');
                    return;
                }

                const subtotal = this.cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const tax = subtotal * 0.08;
                const deliveryFee = this.deliveryOptions[this.selectedDelivery].price;
                const discount = StateManager.getDiscount();
                const total = subtotal + tax + deliveryFee - discount;

                const user = StateManager.getUser();
                const order = {
                    id: `ORD${Date.now()}`,
                    module: this.module,
                    moduleType: this.module.toUpperCase().replace('-', '_'),
                    items: this.cartItems,
                    address,
                    delivery: this.deliveryOptions[this.selectedDelivery],
                    payment: this.paymentMethods[this.selectedPayment],
                    notes: document.getElementById('deliveryNotes').value,
                    status: 'confirmed',
                    createdAt: new Date().toISOString(),
                    subtotal,
                    tax,
                    deliveryFee,
                    discount,
                    total
                };

                let persistedOrder = order;
                if (user?.id) {
                    try {
                        const backendOrder = await apiClient.createOrder({
                            userId: user.id,
                            moduleType: order.moduleType,
                            status: 'PENDING',
                            subtotal,
                            tax,
                            deliveryFee,
                            discount,
                            total,
                            notes: order.notes,
                            items: this.cartItems.map((item) => ({
                                id: item.id,
                                productId: item.productId || item.id,
                                name: item.name,
                                brand: item.brand || item.shopName || 'eDaLab',
                                price: item.price,
                                quantity: item.quantity,
                                total: item.price * item.quantity,
                                metadata: {
                                    address: [address.street, address.city, address.zip].filter(Boolean).join(', '),
                                    deliveryLabel: this.deliveryOptions[this.selectedDelivery].name,
                                    deliveryEta: this.deliveryOptions[this.selectedDelivery].time,
                                    paymentLabel: this.paymentMethods[this.selectedPayment].name,
                                },
                            })),
                        });

                        persistedOrder = {
                            ...order,
                            ...backendOrder,
                            module: this.module,
                            moduleType: backendOrder.moduleType || order.moduleType,
                            status: String(backendOrder.status || order.status).toLowerCase(),
                            address,
                            delivery: this.deliveryOptions[this.selectedDelivery],
                            payment: this.paymentMethods[this.selectedPayment],
                        };
                    } catch (error) {
                        console.error('Error persisting order to backend:', error);
                    }
                }

                StateManager.addOrder(persistedOrder);

                StateManager.clearCart(this.module);
                StateManager.setDiscount(0);

                window.location.href = `order-success.html?orderId=${persistedOrder.id}`;
            }

            getSelectedAddress() {
                const user = StateManager.getUser();
                if (this.selectedAddress !== null && user && user.addresses) {
                    return user.addresses[this.selectedAddress];
                }
                return null;
            }

            showEmptyCart() {
                const container = document.getElementById('checkoutContainer');
                container.innerHTML = `
                    <div class="empty-cart-message">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Your Cart is Empty</h2>
                        <p>Add some items to your cart before proceeding to checkout</p>
                        <a href="edalab-website.html" class="continue-shopping-btn">Continue Shopping</a>
                    </div>
                `;
            }
        }
