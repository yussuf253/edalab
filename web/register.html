<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Edalab</title>
    <link rel="stylesheet" href="css/main-styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules.css">
    <style>
        .auth-wrap { max-width: 460px; margin: 90px auto 40px; padding: 20px; }
        .auth-card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .auth-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .auth-sub { color: #666; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .input-wrap { position: relative; }
        .form-input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; }
        .password-input { padding-right: 92px; }
        .form-input:focus { border-color: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }
        .form-input.error { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.12); }
        .field-error { display: none; margin-top: 6px; color: #b91c1c; font-size: 12px; font-weight: 700; }
        .field-error.visible { display: block; }
        .password-toggle { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); border: none; background: transparent; color: #166534; font-size: 12px; font-weight: 800; cursor: pointer; padding: 6px 8px; }
        .password-toggle:focus { outline: none; }
        .field-help { margin-top: 6px; color: #6b7280; font-size: 12px; }
        .auth-btn { width: 100%; padding: 14px; border-radius: 10px; background: linear-gradient(135deg,#16A34A 0%,#22C55E 100%); color: white; font-weight: 800; }
        .auth-btn[disabled] { opacity: 0.7; cursor: not-allowed; }
        .auth-error { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; font-size: 14px; font-weight: 700; }
        .auth-footer { margin-top: 18px; text-align: center; font-size: 14px; color: #666; }
        .auth-footer a { color: #16A34A; font-weight: 700; }
    </style>
</head>
<body>
    <nav id="nav" data-static-unified="true">
        <div class="nav-w nav-w-unified"><a class="nav-logo" href="edalab-website.html"><div class="nav-logo-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div><span>eDalab</span></a><div class="nav-links nav-links-unified"><a href="edalab-website.html" class="nav-a" data-nav-link="home">Home</a><a href="food.html" class="nav-a" data-nav-link="food">Food</a><a href="shopping.html" class="nav-a" data-nav-link="shopping">Shopping</a><a href="pharmacy.html" class="nav-a" data-nav-link="pharmacy">Pharmacy</a><a href="doctor.html" class="nav-a" data-nav-link="doctor">Doctor</a><a href="hotel.html" class="nav-a" data-nav-link="hotel">Hotel</a><a href="ride.html" class="nav-a" data-nav-link="ride">Ride</a><a href="home-services.html" class="nav-a" data-nav-link="services">Services</a><a href="laundry.html" class="nav-a" data-nav-link="laundry">Laundry</a></div><div class="nav-right nav-right-unified"><div class="nav-quick-actions"><a href="wishlist.html" class="nav-icon-btn" aria-label="Wishlist"><span class="nav-icon-symbol">♡</span><span class="nav-icon-label">Wishlist</span><span class="nav-badge is-empty" id="navWishlistCount" data-nav-badge="wishlist">0</span></a><a href="cart.html" class="nav-icon-btn" aria-label="Cart"><span class="nav-icon-symbol">🛒</span><span class="nav-icon-label">Cart</span><span class="nav-badge is-empty" id="navCartCount" data-nav-badge="cart">0</span></a></div><div class="nav-auth-slot"></div></div></div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-title">Create your account</div>
            <div class="auth-sub">Register once to save your orders, addresses, and payment methods.</div>
            <div class="auth-error" id="authError"></div>
            <div class="form-group">
                <label class="form-label">Full name</label>
                <div class="input-wrap">
                    <input class="form-input" id="name" type="text" placeholder="Your full name" autocomplete="name">
                </div>
                <div class="field-error" id="nameError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <div class="input-wrap">
                    <input class="form-input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="field-error" id="emailError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <div class="input-wrap">
                    <input class="form-input" id="phone" type="tel" placeholder="+253 77 00 00 00" autocomplete="tel">
                </div>
                <div class="field-error" id="phoneError"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input class="form-input password-input" id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
                    <button class="password-toggle" id="passwordToggle" type="button">Show</button>
                </div>
                <div class="field-error" id="passwordError"></div>
                <div class="field-help">Use at least 6 characters.</div>
            </div>
            <button class="auth-btn" id="registerButton" onclick="registerPage.submit()">Create account</button>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="js/state-manager.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/ui-components.js"></script>
    <script>
        class RegisterPage {
            constructor() {
                this.fields = {
                    name: document.getElementById('name'),
                    email: document.getElementById('email'),
                    phone: document.getElementById('phone'),
                    password: document.getElementById('password'),
                };
                this.errorBox = document.getElementById('authError');
                this.button = document.getElementById('registerButton');
                this.passwordToggle = document.getElementById('passwordToggle');
                this.fieldErrors = {
                    name: document.getElementById('nameError'),
                    email: document.getElementById('emailError'),
                    phone: document.getElementById('phoneError'),
                    password: document.getElementById('passwordError'),
                };
                Object.values(this.fields).forEach((input) => {
                    input.addEventListener('input', () => this.clearFieldState(input.id));
                    input.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter') {
                            this.submit();
                        }
                    });
                });
                this.passwordToggle.addEventListener('click', () => this.togglePasswordVisibility());
            }

            setLoading(isLoading) {
                this.button.disabled = isLoading;
                this.button.textContent = isLoading ? 'Creating account...' : 'Create account';
                this.passwordToggle.disabled = isLoading;
            }

            showError(message, fieldMessages = {}) {
                this.errorBox.style.display = 'block';
                this.errorBox.textContent = message;
                Object.entries(fieldMessages).forEach(([fieldId, fieldMessage]) => {
                    const field = this.fields[fieldId];
                    const error = this.fieldErrors[fieldId];
                    if (field) field.classList.add('error');
                    if (error && fieldMessage) {
                        error.textContent = fieldMessage;
                        error.classList.add('visible');
                    }
                });
            }

            clearError() {
                this.errorBox.style.display = 'none';
                this.errorBox.textContent = '';
                Object.keys(this.fields).forEach((fieldId) => this.clearFieldState(fieldId));
            }

            clearFieldState(fieldId) {
                const field = this.fields[fieldId];
                const error = this.fieldErrors[fieldId];
                if (field) field.classList.remove('error');
                if (error) {
                    error.textContent = '';
                    error.classList.remove('visible');
                }
            }

            togglePasswordVisibility() {
                const isPassword = this.fields.password.type === 'password';
                this.fields.password.type = isPassword ? 'text' : 'password';
                this.passwordToggle.textContent = isPassword ? 'Hide' : 'Show';
            }

            isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            async submit() {
                this.clearError();
                const name = this.fields.name.value.trim();
                const email = this.fields.email.value.trim();
                const phone = this.fields.phone.value.trim();
                const password = this.fields.password.value;
                if (!name || !email || !password) {
                    this.showError('Fill in the required fields.', {
                        name: !name ? 'Full name is required.' : '',
                        email: !email ? 'Email is required.' : '',
                        password: !password ? 'Password is required.' : '',
                    });
                    return;
                }

                if (!this.isValidEmail(email)) {
                    this.showError('Enter a valid email address.', {
                        email: 'Use a valid email like name@example.com.',
                    });
                    return;
                }

                if (password.length < 6) {
                    this.showError('Password must be at least 6 characters.', {
                        password: 'Choose a password with at least 6 characters.',
                    });
                    return;
                }

                if (phone && !/^[+\d][\d\s()-]{6,}$/.test(phone)) {
                    this.showError('Enter a valid phone number or leave it empty.', {
                        phone: 'Phone number format looks incomplete.',
                    });
                    return;
                }

                try {
                    this.setLoading(true);
                    await apiClient.register({ name, email, phone, password });
                    UIComponents.showToast('Account created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = UIComponents.consumePostAuthRedirect('profile.html');
                    }, 500);
                } catch (error) {
                    const message = error?.message || 'Registration failed. Try another email.';
                    const isEmailConflict = /already exists|email/i.test(message);
                    this.showError(message, isEmailConflict ? {
                        email: 'This email is already in use.',
                    } : {});
                } finally {
                    this.setLoading(false);
                }
            }
        }

        UIComponents.mountUnifiedNavbar({ active: '' });
        const registerPage = new RegisterPage();
    </script>
</body>
</html>
