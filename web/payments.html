<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - Edalab</title>
    <link rel="stylesheet" href="css/main-styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules.css">
    <style>
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .payment-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .payment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .payment-name { font-weight: 700; color: #1a1a1a; }
        .payment-number { font-size: 14px; color: #666; margin-bottom: 8px; font-family: monospace; }
        .btn-danger { padding: 8px 12px; background: white; border: 1px solid #ff6b6b; color: #ff6b6b; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-add { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
        .form-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-primary { padding: 10px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <nav id="nav" data-static-unified="true">
        <div class="nav-w nav-w-unified"><a class="nav-logo" href="edalab-website.html"><div class="nav-logo-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div><span>eDalab</span></a><div class="nav-links nav-links-unified"><a href="edalab-website.html" class="nav-a" data-nav-link="home">Home</a><a href="food.html" class="nav-a" data-nav-link="food">Food</a><a href="shopping.html" class="nav-a" data-nav-link="shopping">Shopping</a><a href="pharmacy.html" class="nav-a" data-nav-link="pharmacy">Pharmacy</a><a href="doctor.html" class="nav-a" data-nav-link="doctor">Doctor</a><a href="hotel.html" class="nav-a" data-nav-link="hotel">Hotel</a><a href="ride.html" class="nav-a" data-nav-link="ride">Ride</a><a href="home-services.html" class="nav-a" data-nav-link="services">Services</a><a href="laundry.html" class="nav-a" data-nav-link="laundry">Laundry</a></div><div class="nav-right nav-right-unified"><div class="nav-quick-actions"><a href="wishlist.html" class="nav-icon-btn" aria-label="Wishlist"><span class="nav-icon-symbol">♡</span><span class="nav-icon-label">Wishlist</span><span class="nav-badge is-empty" id="navWishlistCount" data-nav-badge="wishlist">0</span></a><a href="cart.html" class="nav-icon-btn" aria-label="Cart"><span class="nav-icon-symbol">🛒</span><span class="nav-icon-label">Cart</span><span class="nav-badge is-empty" id="navCartCount" data-nav-badge="cart">0</span></a></div><div class="nav-auth-slot"></div></div></div>
    </nav>

    <div class="container">
        <h1 class="page-title">Payment Methods</h1>

        <button class="btn-add" onclick="payments.toggleForm()">+ Add Payment Method</button>

        <!-- Add Payment Form -->
        <div id="paymentForm" class="form-card" style="display: none;">
            <h3 style="margin-top: 0;">Add Payment Method</h3>
            <div class="form-group">
                <label class="form-label">Card Holder Name</label>
                <input type="text" class="form-input" id="cardName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-input" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Expires</label>
                    <input type="text" class="form-input" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group">
                    <label class="form-label">CVV</label>
                    <input type="text" class="form-input" id="cardCVV" placeholder="123" maxlength="3">
                </div>
            </div>
            <div class="form-buttons">
                <button class="btn-primary" onclick="payments.savePayment()">Save</button>
                <button class="btn-primary" style="background: white; color: #667eea; border: 1px solid #667eea;" onclick="payments.toggleForm()">Cancel</button>
            </div>
        </div>

        <!-- Payments List -->
        <div id="paymentsList"></div>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/ui-components.js"></script>
    <script>
        class PaymentsManager {
            constructor() {
                this.user = StateManager.getUser();
                this.init();
            }

            async init() {
                if (!UIComponents.requireAuth({
                    message: 'Please log in to manage your payment methods.',
                    next: 'payments.html',
                })) {
                    return;
                }
                await this.loadUserData();
                this.renderPayments();
            }

            async loadUserData() {
                if (this.user?.id) {
                    try {
                        const methods = await apiClient.getPaymentMethods(this.user.id);
                        this.user.payments = methods || [];
                        StateManager.setUser(this.user);
                    } catch (error) {
                        console.error('Error loading payment methods:', error);
                    }
                }
            }

            renderPayments() {
                const container = document.getElementById('paymentsList');
                if (!this.user || !this.user.payments || this.user.payments.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">💳</div><p>No payment methods</p></div>';
                    return;
                }

                container.innerHTML = this.user.payments.map((card, idx) => `
                    <div class="payment-card">
                        <div class="payment-header">
                            <span class="payment-name">💳 ${card.brand || card.name || card.type || 'Card'}</span>
                            <button class="btn-danger" onclick="payments.deletePayment(${idx})">Remove</button>
                        </div>
                        <div class="payment-number">**** **** **** ${card.last4 || (card.number ? card.number.slice(-4) : '0000')}</div>
                        <div style="font-size: 12px; color: #999;">Expires ${card.expiry || ((card.expiryMonth && card.expiryYear) ? `${String(card.expiryMonth).padStart(2, '0')}/${String(card.expiryYear).slice(-2)}` : '--/--')}</div>
                    </div>
                `).join('');
            }

            toggleForm() {
                const form = document.getElementById('paymentForm');
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            }

            async savePayment() {
                const name = document.getElementById('cardName').value.trim();
                const number = document.getElementById('cardNumber').value.trim();
                const expiry = document.getElementById('cardExpiry').value.trim();
                const cvv = document.getElementById('cardCVV').value.trim();

                if (!name || !number || !expiry || !cvv) {
                    UIComponents.showToast('Please fill in all fields');
                    return;
                }

                if (!this.user.payments) this.user.payments = [];
                if (this.user.id) {
                    const [expiryMonth, expiryYear] = expiry.split('/');
                    try {
                        const methods = await apiClient.addPaymentMethod(this.user.id, {
                            type: 'CARD',
                            brand: name,
                            last4: number.slice(-4),
                            expiryMonth: Number(expiryMonth),
                            expiryYear: 2000 + Number(expiryYear),
                            isDefault: this.user.payments.length === 0,
                        });
                        this.user.payments = methods || [];
                    } catch (error) {
                        console.error('Error saving payment method:', error);
                        UIComponents.showToast('Failed to save payment method');
                        return;
                    }
                } else {
                    this.user.payments.push({ name, number, expiry, cvv });
                }
                StateManager.setUser(this.user);

                UIComponents.showToast('Payment method saved!');
                document.getElementById('cardName').value = '';
                document.getElementById('cardNumber').value = '';
                document.getElementById('cardExpiry').value = '';
                document.getElementById('cardCVV').value = '';
                this.toggleForm();
                this.renderPayments();
            }

            async deletePayment(idx) {
                if (confirm('Delete this payment method?')) {
                    const payment = this.user.payments[idx];
                    if (this.user.id && payment?.id) {
                        try {
                            await apiClient.deletePaymentMethod(this.user.id, payment.id);
                            this.user.payments.splice(idx, 1);
                        } catch (error) {
                            console.error('Error deleting payment method:', error);
                            UIComponents.showToast('Failed to delete payment method');
                            return;
                        }
                    } else {
                        this.user.payments.splice(idx, 1);
                    }
                    StateManager.setUser(this.user);
                    this.renderPayments();
                }
            }
        }

        UIComponents.mountUnifiedNavbar({ active: '', offsetBody: true });
        const payments = new PaymentsManager();
    </script>
</body>
</html>
